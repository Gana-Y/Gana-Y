name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Lowlighter Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Gana-Y
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          filename: github-metrics.svg

          # 🏆 Achievements (Ignored 'manager' to fix sunsetted Projects Classic GraphQL error)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_ignored: manager

          # 📅 3D Isometric Commit Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # 🈷️ Languages Activity (Detailed lines & bytes)
          plugin_languages: yes
          plugin_languages_analysis_details: lines, bytes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # 📰 Recent Activity Stream (Fixed event types to avoid API undefined filter error)
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: push, issue, pr, release, star, fork

          # 🎟️ Issues & Pull Requests Followup
          plugin_followup: yes
          plugin_followup_sections: user, repositories
          plugin_followup_indepth: yes

          # 🎭 Comment Reactions Ring
          plugin_reactions: yes
          plugin_reactions_display: ring
          plugin_reactions_limit: 200
