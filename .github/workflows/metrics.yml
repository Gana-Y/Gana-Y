name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Card 1: Overview, PR Status & Languages
      - name: Overview & Languages Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Gana-Y
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          filename: github-metrics-overview.svg

          # 🈸 Languages Activity
          plugin_languages: yes
          plugin_languages_analysis_details: lines, bytes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # 🎟️ Issues & PRs Followup
          plugin_followup: yes
          plugin_followup_sections: user, repositories
          plugin_followup_indepth: yes

      # Card 2: 3D Isometric Commit Calendar (Standalone Card)
      - name: 3D Calendar Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Gana-Y
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          filename: github-metrics-calendar.svg

          # 📅 3D Isometric Commit Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Card 3: Community Reactions (Standalone Card)
      - name: Reactions Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Gana-Y
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          filename: github-metrics-reactions.svg

          # 🎭 Comment Reactions Ring
          plugin_reactions: yes
          plugin_reactions_display: ring
          plugin_reactions_limit: 200

      # Card 4: Dynamic Achievements Badges (Native High-Reliability Generator)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Dynamic Achievements Badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_achievements.py

      - name: Commit and Push Achievements Card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add github-metrics-achievements.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update github-metrics-achievements.svg - [Skip GitHub Action]" && git push origin main)
