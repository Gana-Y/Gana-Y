name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Card 1: Overview, PR Status & Languages
      - name: Overview & Languages Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Gana-Y
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          filename: github-metrics-overview.svg

          # 🈷️ Languages Activity
          plugin_languages: yes
          plugin_languages_analysis_details: lines, bytes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # 🎟️ Issues & PRs Followup
          plugin_followup: yes
          plugin_followup_sections: user, repositories
          plugin_followup_indepth: yes

      # Card 2: 3D Isometric Commit Calendar (Standalone Card)
      - name: 3D Calendar Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Gana-Y
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          filename: github-metrics-calendar.svg

          # 📅 3D Isometric Commit Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Card 3: Community Reactions (Standalone Card)
      - name: Reactions Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Gana-Y
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          filename: github-metrics-reactions.svg

          # 🎭 Comment Reactions Ring
          plugin_reactions: yes
          plugin_reactions_display: ring
          plugin_reactions_limit: 200
