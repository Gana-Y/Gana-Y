<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,'SFMono-Regular',Menlo,monospace" width="1126" height="634">
<style>
.key {fill: #bb9af7;}
.value {fill: #7dcfff;}
.dots {fill: #565f89;}
text, tspan {white-space: pre;}
.thought {opacity: 0; transform-box: fill-box; transform-origin: center; animation: think ease-out infinite;}
@keyframes think {
  0% {opacity: 0; transform: translate(0, 0) scale(0.6);}
  20% {opacity: 0.95;}
  70% {opacity: 0.6;}
  100% {opacity: 0; transform: translate(var(--drift), -75px) scale(1.1);}
}
.rain {opacity: 0.35; animation: fall linear infinite;}
@keyframes fall {from {transform: translateY(-100%);} to {transform: translateY(var(--fall));}}
.cursor {animation: blink 1s step-end infinite;}
@keyframes blink {0%, 100% {opacity: 1;} 50% {opacity: 0;}}
@media (prefers-reduced-motion: reduce) {
  .thought, .rain {display: none;}
  .cursor {animation: none;}
}
</style>
